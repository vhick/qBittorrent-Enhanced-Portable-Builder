name: Build qBittorrent Enhanced Portable (Manual)

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Official upstream release: latest or release-5.2.4.10'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: read

jobs:
  portable:
    name: Windows x64 Portable ZIP
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out portable builder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon and packaging tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pefile==2024.8.26 Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }

      - name: Run offline builder tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Offline tests failed.' }

      - name: Download and verify upstream Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        shell: pwsh
        run: |
          python scripts/resolve_release.py --tag "$env:UPSTREAM_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Official release download or SHA256 verification failed.' }

      - name: Extract official installer without installing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $sevenZip) {
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) { throw '7-Zip was not found on the Windows runner.' }
          $installer = Get-ChildItem -LiteralPath 'work/download' -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Downloaded installer is missing.' }
          New-Item -ItemType Directory -Force -Path 'work/extracted' | Out-Null
          & $sevenZip 'x' '-y' "-owork/extracted" $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw '7-Zip extraction of the official installer failed.' }

      - name: Extract original multi-resolution qBittorrent icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path 'work/extracted' -Recurse -File | Where-Object { $_.Name -ieq 'qbittorrent.exe' } | Select-Object -First 1
          if (-not $exe) { throw 'No qbittorrent.exe could be found inside installer.' }
          python scripts/extract_icon.py "$($exe.FullName)" work/appicon.ico
          if ($LASTEXITCODE -ne 0) { throw 'Original icon extraction failed; no generic icon will be substituted.' }

      - name: Compile Windows launcher with original icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Windows .NET Framework C# compiler is unavailable.' }
          $source = (Resolve-Path -LiteralPath 'launcher/qBittorrentEnhancedPortable.cs').Path
          $icon = (Resolve-Path -LiteralPath 'work/appicon.ico').Path
          $output = Join-Path (Resolve-Path 'work').Path 'qBittorrentEnhancedPortable.exe'
          & $compiler '/nologo' '/target:winexe' '/platform:x64' '/optimize+' "/out:$output" "/win32icon:$icon" '/reference:System.Windows.Forms.dll' $source
          if ($LASTEXITCODE -ne 0) { throw 'C# compilation failed.' }
          if (-not (Test-Path -LiteralPath $output)) { throw 'Launcher binary was not produced.' }
          $test = Start-Process -FilePath $output -ArgumentList '--portable-self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Launcher self-test returned error code ' + $test.ExitCode }

      - name: Create complete PortableApps-style application ZIP
        shell: pwsh
        run: |
          python scripts/package_app.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          python scripts/verify_package.py
          if ($LASTEXITCODE -ne 0) { throw 'ZIP validation failed.' }

      - name: Upload portable ZIP only
        uses: actions/upload-artifact@v4
        with:
          name: qBittorrent-Enhanced-Portable-Windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
