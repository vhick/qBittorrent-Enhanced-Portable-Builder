name: Build qBittorrent Enhanced Portable (Manual)

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Official release tag, or latest'
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 portable ZIP with Python search support
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Set up build-time Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install icon extraction dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile==2024.8.26 Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Python packaging dependency install failed' }

      - name: Run current v1.3 tests (ignore leftover v1.1 tests)
        shell: pwsh
        run: |
          # Uploading replacement files to GitHub DOES NOT delete files from
          # prior versions. In particular, tests/test_builder.py from v1.1
          # asserts the old launcher behavior and must not be executed here.
          if (Test-Path -LiteralPath 'tests/test_builder.py') {
            Write-Warning 'Obsolete tests/test_builder.py detected. Remove it from this repository when convenient; it belongs to v1.1.'
          }
          python -m unittest discover -s tests -p 'test_portable_builder.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Current portable builder tests failed' }

      - name: Download, verify, and extract official upstream releases
        timeout-minutes: 12
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          python scripts/build.py --tag "$env:UPSTREAM_TAG" --out work
          if ($LASTEXITCODE -ne 0) { throw 'Official app or Python download/extraction failed' }

      - name: Test bundled Python runtime and search dependencies
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'work/qBittorrentEnhancedPortable/App/Python/python.exe').Path
          # Verify the ACTUAL bundled Python (rather than GitHub runner Python).
          & $exe -c "import sys, ssl, json, urllib.request, xml.etree.ElementTree, multiprocessing.dummy; assert sys.version_info[:2] == (3,14); print('Bundled Python OK:', sys.version); print('OpenSSL:', ssl.OPENSSL_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Python failed basic modules check' }
          # qBittorrent nova scripts add their own location to sys.path.
          # Do not use the runner's globally installed Python during this test.

      - name: Extract original qBittorrent icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path 'work/qBittorrentEnhancedPortable/App/qBittorrent/qbittorrent.exe').Path
          python scripts/icon.py "$source" 'work/qBittorrentEnhancedPortable/App/AppInfo/appicon.ico'
          if ($LASTEXITCODE -ne 0) { throw 'Original icon extraction failed' }

      - name: Compile and headless-test launcher
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path $compiler)) { throw 'Missing .NET Framework C# compiler' }
          $source = (Resolve-Path 'launcher/qBittorrentEnhancedPortable.cs').Path
          $icon = (Resolve-Path 'work/qBittorrentEnhancedPortable/App/AppInfo/appicon.ico').Path
          $root = (Resolve-Path 'work/qBittorrentEnhancedPortable').Path
          $dest = Join-Path $root 'qBittorrentEnhancedPortable.exe'
          & $compiler '/nologo' '/target:winexe' '/platform:x64' '/optimize+' "/win32icon:$icon" "/out:$dest" '/reference:System.Windows.Forms.dll' $source
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $dest)) { throw 'Launcher compilation failed' }
          $p = Start-Process -FilePath $dest -ArgumentList '--portable-self-test' -PassThru
          try {
            if (!$p.WaitForExit(15000)) {
              try { $p.Kill() } catch { }
              throw 'Launcher self-test timeout (15 sec)'
            }
            if ($p.ExitCode -ne 0) { throw "Launcher self-test failed with exit code $($p.ExitCode)" }
          } finally { $p.Dispose() }
          Write-Host 'Launcher self-test passed'
          # Embed the portable launcher source in the final app, not user data.
          New-Item -ItemType Directory -Force 'work/qBittorrentEnhancedPortable/Other' | Out-Null
          Copy-Item -LiteralPath $source -Destination 'work/qBittorrentEnhancedPortable/Other/Launcher-Source.cs'
          Copy-Item -LiteralPath 'README.md' -Destination 'work/qBittorrentEnhancedPortable/Other/PORTABLE-GUIDE.md'

      - name: Verify final package and create ZIP
        timeout-minutes: 5
        shell: pwsh
        run: |
          python scripts/package.py work/qBittorrentEnhancedPortable dist/qBittorrent-Enhanced-Portable-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Portable ZIP creation or validation failed' }

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: qBittorrent-Enhanced-Portable-Windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
